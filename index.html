<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Julian Brunet | Alpine Ski Racing Coach & Athlete Portfolio</title>
  <meta name="description" content="Julian Brunet — Head U18 FIS Coach at Mont Garceau, U18 FIS Quebec Super Series Champion, former Équipe du Québec & Top-500 FIS Alpine Racer (34.95 PB)." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2306080c'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%2300f0ff'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #06080c;
      --bg-surface: #0c1017;
      --bg-card: #111722;
      --bg-card-hover: #161f2e;
      --border-dim: #1e293b;
      --border-bright: #334155;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #8494aa;
      --accent-cyan: #00f0ff;
      --accent-cyan-dim: rgba(0, 240, 255, 0.12);
      --accent-gold: #f59e0b;
      --accent-gold-dim: rgba(245, 158, 11, 0.14);
      --accent-orange: #ff5500;
      --accent-green: #10b981;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-sans);
    }

    body {
      background-color: var(--bg-base);
      background-image: 
        linear-gradient(to right, rgba(30, 41, 59, 0.18) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(30, 41, 59, 0.18) 1px, transparent 1px);
      background-size: 48px 48px;
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* Telemetry Top Bar */
    .telemetry-bar {
      background: #040609;
      border-bottom: 1px solid var(--border-dim);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-dim);
      padding: 0.45rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .telemetry-bar span.live-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      background: var(--accent-cyan);
      border-radius: 50%;
      margin-right: 6px;
      box-shadow: 0 0 8px var(--accent-cyan);
    }

    /* Navbar */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(6, 8, 12, 0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-dim);
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.05em;
      color: var(--text-main);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .brand-accent {
      color: var(--accent-cyan);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      font-family: var(--font-mono);
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: var(--accent-cyan);
    }

    .lang-btn {
      background: var(--bg-card);
      border: 1px solid var(--accent-cyan);
      color: var(--accent-cyan);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .lang-btn:hover {
      background: var(--accent-cyan);
      color: #000;
    }

    /* Layout Container */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    section {
      padding: 5rem 0;
      border-bottom: 1px solid var(--border-dim);
    }

    /* Section Headers */
    .section-tag {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--accent-cyan);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 0.5rem;
      display: block;
    }

    .section-title {
      font-size: clamp(1.75rem, 3.5vw, 2.5rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
    }

    .section-desc {
      color: var(--text-muted);
      max-width: 680px;
      margin-bottom: 2.5rem;
      font-size: 1rem;
    }

    /* Hero Section */
    .hero {
      padding: 5.5rem 0 4.5rem;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.25fr 0.95fr;
      gap: 3rem;
      align-items: center;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-mono);
      font-size: 0.74rem;
      color: var(--accent-cyan);
      background: var(--accent-cyan-dim);
      border: 1px solid rgba(0, 240, 255, 0.3);
      padding: 0.35rem 0.75rem;
      border-radius: 4px;
      margin-bottom: 1.25rem;
    }

    .hero h1 {
      font-size: clamp(2.3rem, 5vw, 3.75rem);
      font-weight: 800;
      line-height: 1.08;
      letter-spacing: -0.03em;
      margin-bottom: 1.25rem;
    }

    .hero h1 .highlight {
      color: var(--accent-cyan);
    }

    .hero p {
      font-size: 1.08rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
      max-width: 600px;
    }

    .cta-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.9rem;
      margin-bottom: 2.5rem;
    }

    .btn-primary {
      background: var(--accent-cyan);
      color: #040609;
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 0.84rem;
      padding: 0.8rem 1.35rem;
      border-radius: 4px;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
    }

    .btn-secondary {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-bright);
      font-family: var(--font-mono);
      font-weight: 500;
      font-size: 0.84rem;
      padding: 0.8rem 1.25rem;
      border-radius: 4px;
      text-decoration: none;
      transition: border-color 0.2s ease, color 0.2s ease;
    }

    .btn-secondary:hover {
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    /* Telemetry KPI Strip */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-top: 2rem;
    }

    .kpi-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-dim);
      border-left: 3px solid var(--accent-cyan);
      padding: 1.15rem;
      border-radius: 4px;
    }

    .kpi-card.orange {
      border-left-color: var(--accent-orange);
    }

    .kpi-value {
      font-family: var(--font-mono);
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.1;
      margin-bottom: 0.35rem;
    }

    .kpi-label {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Labeled Photo Placeholders */
    .photo-placeholder {
      background: linear-gradient(135deg, #0d131d 0%, #131c2b 100%);
      border: 1px dashed var(--border-bright);
      border-radius: 6px;
      padding: 2rem;
      min-height: 360px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .photo-placeholder::before {
      content: "TELEMETRY VISUAL FEED // PLACEHOLDER";
      position: absolute;
      top: 12px;
      left: 14px;
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--accent-cyan);
      letter-spacing: 0.08em;
    }

    .photo-placeholder::after {
      content: "REC [●]";
      position: absolute;
      top: 12px;
      right: 14px;
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--accent-orange);
    }

    .placeholder-icon {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--accent-cyan);
      border: 1px solid rgba(0, 240, 255, 0.35);
      background: var(--accent-cyan-dim);
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      margin-bottom: 1rem;
    }

    .placeholder-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-main);
      margin-bottom: 0.4rem;
    }

    .placeholder-sub {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
      max-width: 320px;
    }

    /* Skills & Competencies Grid */
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.25rem;
    }

    .skill-card {
      background: var(--bg-card);
      border: 1px solid var(--border-dim);
      padding: 1.5rem;
      border-radius: 6px;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .skill-card:hover {
      border-color: var(--accent-cyan);
      transform: translateY(-2px);
    }

    .skill-index {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--accent-cyan);
      margin-bottom: 0.6rem;
      display: block;
    }

    .skill-card h3 {
      font-size: 1.1rem;
      margin-bottom: 0.6rem;
      color: var(--text-main);
    }

    .skill-card p {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* =====================================================
       INTEGRATED CAREER TRAJECTORY TELEMETRY GRAPH (SVG)
       ===================================================== */
    .trajectory-card {
      background: var(--bg-card);
      border: 1px solid var(--border-dim);
      border-radius: 8px;
      margin-bottom: 2rem;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }

    .trajectory-header {
      padding: 1rem 1.35rem;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-dim);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .trajectory-title-block {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .trajectory-title {
      font-family: var(--font-mono);
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: 0.04em;
    }

    .trajectory-subtitle {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-dim);
    }

    .trajectory-controls {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .chart-toggle-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-bright);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.38rem 0.75rem;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.18s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
    }

    .chart-toggle-btn:hover {
      border-color: var(--accent-cyan);
      color: var(--text-main);
    }

    .chart-toggle-btn.active-gold {
      background: var(--accent-gold-dim);
      border-color: var(--accent-gold);
      color: #fbbf24;
    }

    .chart-toggle-btn.active-cyan {
      background: var(--accent-cyan-dim);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .trajectory-scroll-wrap {
      width: 100%;
      overflow-x: auto;
      background:
        radial-gradient(circle at 85% 18%, rgba(245, 158, 11, 0.07), transparent 40%),
        radial-gradient(circle at 20% 40%, rgba(0, 240, 255, 0.05), transparent 45%),
        #080b11;
      padding: 0.75rem 0.5rem 0.25rem;
    }

    .trajectory-svg {
      width: 100%;
      min-width: 860px;
      height: auto;
      display: block;
      user-select: none;
    }

    .node-group {
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .peer-legend-bar {
      display: none;
      padding: 0.65rem 1.35rem;
      background: #090d14;
      border-top: 1px solid var(--border-dim);
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-muted);
      flex-wrap: wrap;
      gap: 0.9rem;
      align-items: center;
    }

    .peer-legend-bar.visible {
      display: flex;
    }

    .peer-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .trajectory-inspector {
      padding: 0.95rem 1.35rem;
      background: var(--bg-surface);
      border-top: 1px solid var(--border-dim);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      font-family: var(--font-mono);
      font-size: 0.78rem;
    }

    .inspector-main {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      flex-wrap: wrap;
    }

    .inspector-badge {
      background: var(--accent-gold-dim);
      border: 1px solid var(--accent-gold);
      color: #fbbf24;
      font-weight: 700;
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      font-size: 0.75rem;
    }

    .inspector-note {
      color: var(--text-muted);
      font-family: var(--font-sans);
      font-size: 0.86rem;
    }

    /* DLS & FIS Telemetry Section */
    .telemetry-layout {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 2rem;
      align-items: start;
    }

    .table-wrapper {
      background: var(--bg-card);
      border: 1px solid var(--border-dim);
      border-radius: 6px;
      overflow-x: auto;
    }

    .table-header-bar {
      padding: 0.9rem 1.25rem;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-dim);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--text-main);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }

    th, td {
      padding: 0.85rem 1.1rem;
      text-align: left;
      border-bottom: 1px solid var(--border-dim);
    }

    th {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      text-transform: uppercase;
      color: var(--text-dim);
      letter-spacing: 0.06em;
      background: rgba(12, 16, 23, 0.6);
    }

    td {
      font-family: var(--font-mono);
    }

    tr:hover td {
      background: var(--bg-card-hover);
    }

    .rank-badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 3px;
      font-weight: 700;
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.12);
      color: var(--text-main);
    }

    .rank-badge.podium {
      background: var(--accent-cyan-dim);
      color: var(--accent-cyan);
      border: 1px solid rgba(0, 240, 255, 0.4);
    }

    .rank-badge.top5 {
      background: rgba(255, 85, 0, 0.15);
      color: #ff7733;
      border: 1px solid rgba(255, 85, 0, 0.35);
    }

    .fis-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-dim);
      border-radius: 6px;
      padding: 1.5rem;
    }

    .fis-panel h3 {
      font-size: 1.15rem;
      margin-bottom: 0.75rem;
    }

    .fis-stat-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-dim);
      border-left: 3px solid var(--accent-cyan);
      padding: 1rem;
      border-radius: 4px;
      margin-bottom: 1rem;
    }

    .fis-stat-box.champion {
      border-left-color: var(--accent-orange);
    }

    .fis-stat-box .num {
      font-family: var(--font-mono);
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--accent-cyan);
    }

    .fis-stat-box.champion .num {
      color: #ff7733;
    }

    .fis-stat-box .lbl {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    /* Lineage Timeline */
    .timeline {
      position: relative;
      padding-left: 2rem;
      border-left: 2px solid var(--border-bright);
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
    }

    .timeline-item {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border-dim);
      padding: 1.35rem 1.5rem;
      border-radius: 6px;
    }

    .timeline-item::before {
      content: "";
      position: absolute;
      left: -2.42rem;
      top: 1.5rem;
      width: 12px;
      height: 12px;
      background: var(--bg-base);
      border: 2px solid var(--accent-cyan);
      border-radius: 50%;
    }

    .timeline-phase {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--accent-cyan);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.35rem;
      display: block;
    }

    .timeline-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.45rem;
    }

    .timeline-desc {
      font-size: 0.92rem;
      color: var(--text-muted);
    }

    /* U18 Squad Section */
    .coaching-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 2rem;
      align-items: center;
    }

    .squad-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
      gap: 0.75rem;
      margin-top: 1.25rem;
    }

    .athlete-chip {
      background: var(--bg-surface);
      border: 1px solid var(--border-dim);
      padding: 0.75rem 1rem;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 0.82
